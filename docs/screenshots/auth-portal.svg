<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Browser Window Wrapper -->
  <rect x="20" y="20" width="1160" height="640" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadow3)"/>

  <!-- Browser Title Bar -->
  <path d="M 20 32 Q 20 20 32 20 L 1168 20 Q 1180 20 1180 32 L 1180 64 L 20 64 Z" fill="#1e293b"/>
  <circle cx="46" cy="42" r="6" fill="#ef4444"/>
  <circle cx="66" cy="42" r="6" fill="#f59e0b"/>
  <circle cx="86" cy="42" r="6" fill="#10b981"/>
  
  <!-- Address Bar -->
  <rect x="130" y="30" width="920" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="145" y="47" fill="#94a3b8" font-size="12">https://approval-portal-production-9d74e9a4.up.railway.app/register</text>

  <!-- Centered Auth Card -->
