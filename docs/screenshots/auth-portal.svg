  <text x="495" y="261" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">👤 Standard User (Pending)</text>
  <!-- Unselected Role: Administrator -->
  <text x="705" y="261" fill="#94a3b8" font-size="12" font-weight="500" text-anchor="middle">🛡️ Administrator</text>

  <!-- Form Fields -->
  <!-- Name Input -->
  <text x="390" y="305" fill="#cbd5e1" font-size="12" font-weight="600">FULL NAME</text>
  <rect x="390" y="315" width="420" height="40" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="405" y="340" fill="#f8fafc" font-size="13">Rachana Shivalingu</text>

  <!-- Email Input -->
  <text x="390" y="380" fill="#cbd5e1" font-size="12" font-weight="600">EMAIL ADDRESS</text>
  <rect x="390" y="390" width="420" height="40" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="405" y="415" fill="#f8fafc" font-size="13">shivalingurachana461@gmail.com</text>

  <!-- Password Input -->
  <text x="390" y="455" fill="#cbd5e1" font-size="12" font-weight="600">SECURE PASSWORD</text>
  <rect x="390" y="465" width="420" height="40" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="405" y="493" fill="#64748b" font-size="18">••••••••••••••••</text>

